<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyBot - Intelligent Insurance Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: #333;
        }
        .app-container {
            min-height: 100vh; display: flex; flex-direction: column;
            max-width: 1000px; margin: 0 auto; padding: 20px; gap: 20px;
        }
        .header {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 25px; text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header h1 { font-size: 2.2rem; font-weight: 700; color: #667eea; margin-bottom: 8px; }
        .header p { color: #666; font-size: 1rem; margin-bottom: 15px; }
        .status-panel { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .service-status {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            background: rgba(103, 126, 234, 0.1); border-radius: 25px;
            font-size: 0.8rem; font-weight: 500;
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #dc3545; }
        .status-dot.online { background: #28a745; }
        .chat-container {
            flex: 1; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 20px; display: flex; flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); overflow: hidden; min-height: 500px;
        }
        .messages {
            flex: 1; padding: 25px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 16px;
            line-height: 1.4; word-wrap: break-word;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .message.bot {
            background: #f8f9fa; color: #333; align-self: flex-start;
            border: 1px solid #e9ecef; border-bottom-left-radius: 4px;
        }
        .message.system {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
            color: white; align-self: center; max-width: 95%;
            text-align: center; border-radius: 16px;
        }
        .message.error {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white; align-self: center; max-width: 95%; border-radius: 16px;
        }
        .workflow-info {
            margin-top: 10px; padding: 8px 12px;
            background: rgba(103, 126, 234, 0.1); border-radius: 8px;
            font-size: 0.75rem; border-left: 3px solid #667eea;
        }
        .sql-query {
            margin-top: 6px; padding: 8px; background: #2d3748; color: #68d391;
            border-radius: 6px; font-family: monospace; font-size: 0.7rem; overflow-x: auto;
        }
        .input-section {
            padding: 20px 25px; background: rgba(248, 249, 250, 0.8);
            border-top: 1px solid rgba(233, 236, 239, 0.5);
        }
        .input-container { display: flex; gap: 12px; align-items: center; }
        .input-container input {
            flex: 1; padding: 14px 18px; border: 2px solid #e9ecef;
            border-radius: 30px; font-size: 15px; outline: none; 
            transition: all 0.3s ease; background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .input-container input:focus { 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(103, 126, 234, 0.1);
            transform: translateY(-1px);
        }
        .input-container input:disabled {
            background: #f8f9fa;
            color: #6c757d;
            cursor: not-allowed;
        }
        .input-container button {
            padding: 14px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 30px; cursor: pointer;
            font-weight: 600; font-size: 15px; transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(103, 126, 234, 0.3);
            min-width: 80px;
        }
        .input-container button:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(103, 126, 234, 0.4);
        }
        .input-container button:disabled { 
            background: #6c757d; cursor: not-allowed; transform: none; 
            box-shadow: none;
        }
        .examples { margin-top: 15px; text-align: center; }
        .examples h4 { color: #666; margin-bottom: 10px; font-size: 0.8rem; font-weight: 500; }
        .example-buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .example-btn {
            background: white; border: 1px solid #dee2e6; padding: 6px 12px;
            border-radius: 15px; cursor: pointer; font-size: 0.75rem;
            transition: all 0.3s; color: #495057;
        }
        .example-btn:hover { background: #667eea; color: white; transform: translateY(-1px); }
        .loading { 
            display: none; text-align: center; padding: 20px; color: #667eea; 
            font-size: 0.95rem; font-weight: 500;
            background: rgba(103, 126, 234, 0.05);
            border-radius: 12px; margin: 10px 25px;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 12px; height: 12px;
            margin-left: 8px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .connection-status {
            padding: 12px; border-radius: 10px; margin-top: 10px;
            font-weight: 500; text-align: center; font-size: 0.85rem;
        }
        .connection-status.success {
            background: rgba(40, 167, 69, 0.1); color: #155724;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        .connection-status.error {
            background: rgba(220, 53, 69, 0.1); color: #721c24;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>📋 PolicyBot</h1>
            <p>Your Intelligent Insurance Assistant</p>
            <div class="status-panel">
                <div class="service-status">
                    <div class="status-dot" id="ragStatus"></div>
                    <span>RAG Service</span>
                </div>
                <div class="service-status">
                    <div class="status-dot" id="dbStatus"></div>
                    <span>Database Service</span>
                </div>
                <div class="service-status">
                    <div class="status-dot" id="mcpStatus"></div>
                    <span>MCP Service</span>
                </div>
            </div>
            <div id="connectionStatus" class="connection-status" style="display: none;"></div>
        </div>

        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Welcome message removed per user request -->
            </div>

            <div class="loading" id="loading">Processing...</div>

            <div class="input-section">
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Ask about your policies..." disabled>
                    <button id="sendButton" onclick="sendMessage()" disabled>Send</button>
                </div>
                
                <div class="examples">
                    <h4>💡 Example Questions:</h4>
                    <div class="example-buttons">
                        <span class="example-btn" onclick="setMessage('How many active policies?')">📊 Policy count</span>
                        <span class="example-btn" onclick="setMessage('Find John Smith policies')">🔍 Customer search</span>
                        <span class="example-btn" onclick="setMessage('Auto insurance coverage?')">📄 Coverage info</span>
                        <span class="example-btn" onclick="setMessage('Calculate premium for life insurance')">🧮 Premium calc</span>
                        <span class="example-btn" onclick="setMessage('Claims process?')">📋 Claims help</span>
                        <span class="example-btn" onclick="setMessage('Expired policies list')">📊 Expired list</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isConnected = false;
        const API_KEY = "YOUR_API_KEY_HERE"; // Groq API Key (Pre-configured)

        // Show a message that API is pre-configured
        console.log("🚀 LangGraph AI Assistant - Using pre-configured Groq API");

        async function checkServices() {
            try {
                const response = await fetch('/services/status');
                if (response.ok) {
                    const data = await response.json();
                    updateServiceStatus('ragStatus', data.rag_service?.available || false);
                    updateServiceStatus('dbStatus', data.database_service?.available || false);
                    updateServiceStatus('mcpStatus', data.mcp_service?.available || false);
                    return data;
                }
            } catch (error) {
                console.log('Services status check failed:', error);
                // Set all services as offline if status check fails
                updateServiceStatus('ragStatus', false);
                updateServiceStatus('dbStatus', false);
                updateServiceStatus('mcpStatus', false);
            }
            return null;
        }

        function updateServiceStatus(elementId, isOnline) {
            const element = document.getElementById(elementId);
            if (element) element.classList.toggle('online', isOnline);
        }

        async function initializeAgent() {
            showConnectionStatus('🚀 Starting LangGraph AI...', 'success');
            
            try {
                const healthResponse = await fetch('/health');
                if (healthResponse.ok) {
                    const healthData = await healthResponse.json();
                    
                    if (healthData.status === 'healthy') {
                        // Try to check services, but don't fail if it doesn't work
                        try {
                            await checkServices();
                        } catch (error) {
                            console.log('Service status check failed, but continuing:', error);
                        }
                        
                        showConnectionStatus('✅ Ready! Ask me anything!', 'success');
                        enableChat();
                    } else {
                        showConnectionStatus('❌ Service unavailable', 'error');
                    }
                } else {
                    showConnectionStatus('❌ Cannot connect to main service', 'error');
                }
            } catch (error) {
                console.error('Initialization error:', error);
                showConnectionStatus('❌ Connection failed - trying to enable chat anyway', 'error');
                // Enable chat even if initialization partially fails
                setTimeout(() => {
                    enableChat();
                    showConnectionStatus('⚠️ Limited functionality - some services may be offline', 'error');
                }, 2000);
            }
        }

        function showConnectionStatus(message, type) {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.textContent = message;
            statusDiv.className = `connection-status ${type}`;
            statusDiv.style.display = 'block';
        }

        function enableChat() {
            isConnected = true;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            document.getElementById('messageInput').focus();
        }

        function addMessage(content, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (typeof content === 'object' && content !== null) {
                let responseText = content.response || content.answer || 'No response';
                if (!responseText.trim()) responseText = 'Workflow completed but returned no content.';
                
                messageDiv.innerHTML = responseText;
                
                if (content.service_used || content.intent_analysis) {
                    const workflowDiv = document.createElement('div');
                    workflowDiv.className = 'workflow-info';
                    
                    let info = `🔄 <strong>Route:</strong> ${content.service_used || 'Unknown'}`;
                    if (content.intent_analysis) {
                        const confidence = Math.round((content.intent_analysis.confidence || 0) * 100);
                        info += `<br>🎯 <strong>Logic:</strong> ${content.intent_analysis.reasoning || 'N/A'}`;
                        info += `<br>📊 <strong>Confidence:</strong> ${confidence}%`;
                    }
                    
                    workflowDiv.innerHTML = info;
                    messageDiv.appendChild(workflowDiv);
                }
                
                if (content.sql_query && content.sql_query.trim()) {
                    const sqlDiv = document.createElement('div');
                    sqlDiv.innerHTML = `<strong>SQL:</strong><div class="sql-query">${content.sql_query}</div>`;
                    messageDiv.appendChild(sqlDiv);
                }
            } else {
                messageDiv.textContent = content || 'No content';
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function setMessage(text) {
            document.getElementById('messageInput').value = text;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            if (!message) {
                messageInput.focus();
                return;
            }

            addMessage(message, 'user');
            messageInput.value = '';
            
            const loading = document.getElementById('loading');
            const sendButton = document.getElementById('sendButton');
            
            loading.style.display = 'block';
            sendButton.disabled = true;
            messageInput.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, api_key: API_KEY })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMessage = 'Server error';
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMessage = errorData.detail || errorMessage;
                    } catch {}
                    throw new Error(`HTTP ${response.status}: ${errorMessage}`);
                }

                const data = await response.json();
                
                let responseContent = data.response || data.answer || 'No response from workflow';
                if (!responseContent.trim()) {
                    responseContent = 'Workflow completed but no response generated. Check service logs.';
                }
                
                addMessage({
                    response: responseContent,
                    service_used: data.service_used,
                    intent_analysis: data.intent_analysis,
                    sql_query: data.sql_query
                }, 'bot');

            } catch (error) {
                console.error('Chat error:', error);
                addMessage('❌ Error: ' + error.message + ' (Check if all services are running)', 'error');
            } finally {
                loading.style.display = 'none';
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        window.onload = function() {
            initializeAgent();
            setInterval(checkServices, 30000);
        };
    </script>
</body>
</html>
